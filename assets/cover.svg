<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Vitrine de Carreira</title>
  <desc id="desc">Plataforma de diagnóstico e posicionamento profissional</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08101f"/>
      <stop offset="0.55" stop-color="#111b38"/>
      <stop offset="1" stop-color="#0b1428"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fb6a6"/>
      <stop offset="0.55" stop-color="#d8bd68"/>
      <stop offset="1" stop-color="#c9a24b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d8bd68" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d8bd68" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
